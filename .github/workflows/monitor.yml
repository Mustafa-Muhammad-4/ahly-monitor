name: Ahly Ticket Monitor (24/7)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: ahly-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Monitor (every 2 seconds)
        timeout-minutes: 320
        continue-on-error: true
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_INTERVAL_SECONDS: "2"
          OPEN_BROWSER_ON_MATCH: "false"
          SOUND_ALERT_ON_MATCH: "false"
        run: |
          python -m ahly_assistant.cli
